services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: task-management-system-app
    ports:
    - "8081:8080"
    - "8082:8082"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - task-network

  nginx:
    image: nginx:latest
    container_name: task-management-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - task-network

  mysql:
    image: mysql:8.0
    container_name: task-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: task_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task-network

  redis:
    image: redis:7-alpine
    container_name: task-management-redis
    ports:
      - "6379:6379"
    networks:
      - task-network

  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: task-management-queue
    working_dir: /var/www/html
    command: php artisan queue:work redis --tries=3 --timeout=60
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - task-network

networks:
  task-network:

volumes:
  mysql_data: